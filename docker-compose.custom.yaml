services:
  # watchtower is defined in the yams-managed base file; disabled here, replaced by wud.
  # image is repeated so every service has one - wud's compose trigger crashes on services without it.
  watchtower:
    image: nickfedor/watchtower
    profiles: ["disabled"]

  # wud: checks daily at 08:00. Minor/patch updates are applied automatically by rewriting the tag
  # in the compose file + recreating the container; majors only notify (gotify). Changes to this
  # file are committed and pushed by ~/bin/wud-autocommit.sh (cron). Needs the real docker socket:
  # the compose trigger refuses to update containers seen through a TCP/proxy watcher.
  wud:
    image: getwud/wud:8.1.1
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
      - 'wud.trigger.exclude=dockercompose.yams' # never self-update; bump wud by hand
    container_name: wud
    restart: unless-stopped
    ports:
      - 127.0.0.1:3001:3000 # 3000 is taken by securo-frontend; no auth, keep it on loopback
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/delefrati/projects/yams:/compose/yams # directories, not files: editors/git replace inodes
      - /home/delefrati/projects/securo:/compose/securo
      - /home/delefrati/projects/gotify:/compose/gotify
      - /home/delefrati/projects/smtp-gotify:/compose/smtp-gotify
    environment:
      - TZ=America/Sao_Paulo
      - WUD_WATCHER_LOCAL_CRON=0 8 * * *
      - WUD_TRIGGER_GOTIFY_LOCAL_URL=http://gotify:80
      - WUD_TRIGGER_GOTIFY_LOCAL_TOKEN=${WUD_GOTIFY_TOKEN}
      - WUD_TRIGGER_GOTIFY_LOCAL_PRIORITY=5
      # one compose trigger per file. threshold=minor: skip majors. once=false: keep retrying an
      # update that is still pending (the default only fires the first time a version is seen).
      - WUD_TRIGGER_DOCKERCOMPOSE_YAMS_FILE=/compose/yams/docker-compose.custom.yaml
      - WUD_TRIGGER_DOCKERCOMPOSE_YAMS_THRESHOLD=minor
      - WUD_TRIGGER_DOCKERCOMPOSE_YAMS_ONCE=false
      - WUD_TRIGGER_DOCKERCOMPOSE_YAMS_PRUNE=true
      - WUD_TRIGGER_DOCKERCOMPOSE_YAMS_DRYRUN=${WUD_DRYRUN:-false}
      - WUD_TRIGGER_DOCKERCOMPOSE_SECURO_FILE=/compose/securo/docker-compose.yml
      - WUD_TRIGGER_DOCKERCOMPOSE_SECURO_THRESHOLD=minor
      - WUD_TRIGGER_DOCKERCOMPOSE_SECURO_ONCE=false
      - WUD_TRIGGER_DOCKERCOMPOSE_SECURO_PRUNE=true
      - WUD_TRIGGER_DOCKERCOMPOSE_SECURO_DRYRUN=${WUD_DRYRUN:-false}
      - WUD_TRIGGER_DOCKERCOMPOSE_GOTIFY_FILE=/compose/gotify/docker-compose.yaml
      - WUD_TRIGGER_DOCKERCOMPOSE_GOTIFY_THRESHOLD=minor
      - WUD_TRIGGER_DOCKERCOMPOSE_GOTIFY_ONCE=false
      - WUD_TRIGGER_DOCKERCOMPOSE_GOTIFY_PRUNE=true
      - WUD_TRIGGER_DOCKERCOMPOSE_GOTIFY_DRYRUN=${WUD_DRYRUN:-false}
      - WUD_TRIGGER_DOCKERCOMPOSE_SMTPGOTIFY_FILE=/compose/smtp-gotify/docker-compose.yml
      - WUD_TRIGGER_DOCKERCOMPOSE_SMTPGOTIFY_THRESHOLD=minor
      - WUD_TRIGGER_DOCKERCOMPOSE_SMTPGOTIFY_ONCE=false
      - WUD_TRIGGER_DOCKERCOMPOSE_SMTPGOTIFY_PRUNE=true
      - WUD_TRIGGER_DOCKERCOMPOSE_SMTPGOTIFY_DRYRUN=${WUD_DRYRUN:-false}
    networks:
      - default
      - gotify

  # pinned versions for services defined in the yams-managed base file; bump after reviewing wud notifications.
  # ghcr.io/linuxserver = same images as lscr.io, but wud can read ghcr anonymously (its lscr provider needs a github token)
  jellyfin:
    image: ghcr.io/linuxserver/jellyfin:12.2ubu2604-ls53
    labels:
      - 'wud.tag.include=^\d+\.\d+(\.\d+)?ubu\d+-ls\d+$$'
  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls479
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+_v[\d.]+-ls\d+$$'
      - 'wud.tag.transform=^(\d+\.\d+\.\d+)_v[\d.]+-ls(\d+)$$ => $$1-$$2'
  sonarr:
    image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls327
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+\.\d+-ls\d+$$'
      # wud's loose semver parse mangles 4.0.19.2979 into 4.0.1-9...; rewrite to 4.0.19-2979.<ls> first
      - 'wud.tag.transform=^(\d+\.\d+\.\d+)\.(\d+)-ls(\d+)$$ => $$1-$$2.$$3'
  radarr:
    image: ghcr.io/linuxserver/radarr:6.4.4.10685-ls319
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+\.\d+-ls\d+$$'
      # wud's loose semver parse mangles 4.0.19.2979 into 4.0.1-9...; rewrite to 4.0.19-2979.<ls> first
      - 'wud.tag.transform=^(\d+\.\d+\.\d+)\.(\d+)-ls(\d+)$$ => $$1-$$2.$$3'
  bazarr:
    image: ghcr.io/linuxserver/bazarr:v1.6.2-ls367
    labels:
      - 'wud.tag.include=^v\d+\.\d+\.\d+-ls\d+$$'
      - 'wud.tag.transform=^v(\d+\.\d+\.\d+)-ls(\d+)$$ => $$1-$$2'
  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:2.6.5.5623-ls163
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+\.\d+-ls\d+$$'
      # wud's loose semver parse mangles 4.0.19.2979 into 4.0.1-9...; rewrite to 4.0.19-2979.<ls> first
      - 'wud.tag.transform=^(\d+\.\d+\.\d+)\.(\d+)-ls(\d+)$$ => $$1-$$2.$$3'

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    labels:
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
    init: true
    user: 1000:1000
    container_name: seerr
    environment:
      - LOG_LEVEL=INFO
      - TZ=${TZ}
      - TZ=America/Sao_Paulo
      - PUID=${PUID}
      - PGID=${PGID}
      - PORT=5055 #optional
    ports:
      - 127.0.0.1:5055:5055
    volumes:
      - ${INSTALL_DIRECTORY}/config/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
  nginx:
    container_name: nginx
    image: 'jc21/nginx-proxy-manager:2.16.0'
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
    ports:
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '127.0.0.1:81:81' # Admin Web Port (loopback-only; use nginx.lab-delefrati.duckdns.org)
    environment:
      DISABLE_IPV6: 'true'
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
    volumes:
      - ${INSTALL_DIRECTORY}/config/nginx/data:/data
      - ${INSTALL_DIRECTORY}/config/nginx/letsencrypt:/etc/letsencrypt
    networks:
      - default
      - immich
      - gotify
      - securo
    restart: unless-stopped
  unpackerr:
    image: golift/unpackerr:0.16.1
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
    container_name: unpackerr
    volumes:
      - ${MEDIA_DIRECTORY}:/downloads
      - ${INSTALL_DIRECTORY}/config/unpackerr:/config
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
  profilarr:
    image: santiagosayshey/profilarr:v1.1.5
    labels:
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
    container_name: profilarr
    ports:
        - 127.0.0.1:6868:6868
    volumes:
        - ${INSTALL_DIRECTORY}/config/profilarr:/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: unless-stopped
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.10.9
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
    container_name: cleanuparr
    restart: unless-stopped
    ports:
      - 127.0.0.1:11011:11011
    volumes:
      - ${INSTALL_DIRECTORY}/config/cleanuparr:/config
    environment:
      - PORT=11011
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=America/Sao_Paulo
  trawl:
    image: ghcr.io/germondai/trawl:1.8.0
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
    container_name: trawl
    restart: unless-stopped
    ports:
      - "127.0.0.1:8191:8191"
    shm_size: 1gb
    mem_limit: 3g
    environment:
      REDIS_URL: redis://redis:6379
      BROWSER_POOL_SIZE: 5
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  # used by trawl
  redis:
    image: redis:8.8-alpine
    labels:
      - 'wud.tag.include=^8\.8-alpine$$'
      - 'wud.watch.digest=true'
      - 'wud.trigger.exclude=dockercompose.yams' # rebuilds of a floating tag: notify only
    restart: unless-stopped
    volumes:
      - redis_data:/data
  decluttarr:
    image: ghcr.io/manimatter/decluttarr:v2.2.0
    labels:
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
    container_name: decluttarr
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      PUID: 1000
      PGID: 1000
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
    volumes:
      - ${INSTALL_DIRECTORY}/config/decluttarr/config.yaml:/app/config/config.yaml
  navidrome:
    image: deluan/navidrome:0.64.2
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
    container_name: navidrome
    restart: unless-stopped
    user: 1000:1000
    ports:
      - "4533:4533"
    environment:
      ND_LOGLEVEL: info
    volumes:
      - ${INSTALL_DIRECTORY}/config/navidrome:/data
      - ${MEDIA_DIRECTORY}/music:/music:ro
    healthcheck:
      test: wget -q --spider -T 3 http://localhost:4533/ping || exit 1
      start_period: 20s
      timeout: 5s
      interval: 30s
      retries: 3
  lidarr:
    image: ghcr.io/linuxserver/lidarr:3.1.0.4875-ls43
    labels:
      - 'wud.tag.include=^\d+\.\d+\.\d+\.\d+-ls\d+$$'
      # wud's loose semver parse mangles 4.0.19.2979 into 4.0.1-9...; rewrite to 4.0.19-2979.<ls> first
      - 'wud.tag.transform=^(\d+\.\d+\.\d+)\.(\d+)-ls(\d+)$$ => $$1-$$2.$$3'
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    ports:
      - "8686:8686"
    volumes:
      - ${INSTALL_DIRECTORY}/config/lidarr:/config
      - ${MEDIA_DIRECTORY}:/data

volumes:
  redis_data:
networks:
  immich:
    external: true
    name: immich_default
  gotify:
    external: true
    name: gotify_default
  securo:
    external: true
    name: securo_default
